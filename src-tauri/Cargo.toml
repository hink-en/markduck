[package]
name = "markduck"
version = "0.1.4"
description = "A focused Markdown editor for macOS"
authors = ["Markduck"]
edition = "2021"

[workspace]

[lib]
name = "markduck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["macos-private-api"] }
rfd = "0.15"
