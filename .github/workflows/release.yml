name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish universal macOS app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          version = json.loads(Path('src-tauri/tauri.conf.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match the Tauri version'
          assert json.loads(Path('package.json').read_text())['version'] == version, 'package.json version mismatch'
          assert tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version'] == version, 'Cargo.toml version mismatch'
          PY

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build universal macOS application
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg -- --locked

      - name: Package release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Markduck.app \
            "release-assets/Markduck_${RELEASE_TAG}_universal.app.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "Markduck $RELEASE_TAG" \
              --generate-notes \
              --notes "Universal macOS build for Apple Silicon and Intel. Download the DMG and drag Markduck into Applications. This build is not Developer ID signed or notarized by Apple." \
              "${prerelease[@]}"
          fi
